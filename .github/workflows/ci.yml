name: CI

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches:
      - '**'
      - '!main'
      - '!development'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instalar dependências
        run: uv sync --dev

      - name: Executar Ruff (lint)
        run: uv run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instalar dependências
        run: uv sync --dev

      - name: Verificar tipos Python
        run: uv run mypy src/

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instalar dependências
        run: uv sync --dev

      - name: Executar testes
        run: uv run pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Instalar dependências
        run: uv sync

      - name: Verificar build do projeto
        run: |
          # Verificar sintaxe de todos os arquivos Python
          find src -name "*.py" -exec python -m py_compile {} \;
          # Tentar importar o módulo principal para verificar dependências
          uv run python -c "from src.main import app; print('✅ Build verificado com sucesso')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-verification
          path: |
            pyproject.toml
            uv.lock
          retention-days: 7

